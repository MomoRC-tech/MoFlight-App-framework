  <title>MoFlight · Compact Cockpit line glyph masters</title>
  <desc>Authored vector interpretation of Manuel's supplied reference. The default app symbol family, including M2 Medical and the selected folded paper plane. All symbols use a 96-unit optical grid.</desc>
