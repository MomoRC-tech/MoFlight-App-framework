  function restore(saved){
    const model=saved?.modelContent, detail=saved?.privateContent;
    if(!model||model.designVersion!=='0.23')return;
    if(['start','flights','detail','books','anchor','club','profile','analytics'].includes(model.page))state.page=model.page;
    if(books[model.book])state.book=model.book;
    if(['year','aircraft','duration'].includes(model.chart))state.chart=model.chart;
    if(detail){
      if(detail.filters&&['2026','2025','all'].includes(detail.filters.year))state.filters={...defaultFilters(),...detail.filters};
      if(typeof detail.search==='string')state.search=detail.search.slice(0,120);
      state.issues=!!detail.issues;
      if(flights.some(f=>f.id===detail.flight))state.flight=detail.flight;
      if(['count','time','aircraft','duration'].includes(detail.metric))state.metric=detail.metric;
      if(['overview','news','tasks','events'].includes(detail.clubSection))state.clubSection=detail.clubSection;
      if(['current','suggested','error'].includes(detail.sync))state.sync=detail.sync;
      if(['18:00','18:05'].includes(detail.lastSync))state.lastSync=detail.lastSync;

  function comparison(metric){
    const count=metric==='count', a=count?current.count:current.minutes,b=count?previous.count:previous.minutes;
    const ceiling=Math.max(a,b,1)*1.15;
    const main=count?`${a}`:`${Math.floor(a/60)}h ${String(a%60).padStart(2,'0')}m`, old=count?`${b} Flüge`:time(b);
    return `<button type="button" class="mf-compare" data-action="metric" data-metric="${metric}" aria-label="${count?'Fluganzahl':'Bekannte Flugzeit'} im Jahresvergleich öffnen">
      <div class="mf-compare-head"><span class="mf-muted">${count?'Flüge':'Bekannte Flugzeit'}</span><strong>${main}</strong></div>
      <div class="mf-track"><span style="width:${a/ceiling*100}%"></span></div>
      <div class="mf-comparison-previous"><span>2025 · ${old}</span><span>${count?'+1 · +20 %':'+32 min bekannt'}</span></div><div class="mf-track mf-track-old"><span style="width:${b/ceiling*100}%"></span></div>
    </button>`;
  }
  function quickChart(){
    let body;

    if(state.chart==='aircraft'){
      const counts=Object.entries(listYear(2026).reduce((a,f)=>(a[f.reg]=(a[f.reg]??0)+1,a),{}));
      body=`<div class="mf-subbox mf-section-gap">${counts.map(([reg,n])=>`<div class="mf-simplebar"><span>${reg}</span><strong>${n} Flüge</strong><div class="mf-track"><span style="width:${n/6*100}%"></span></div></div>`).join('')}${button('metric','Flugzeuge im Detail →','mf-text-action mf-section-gap','data-metric="aircraft"')}</div>`;
    }
    if(state.chart==='duration')body=`<div class="mf-subbox mf-section-gap"><p class="mf-muted">Flüge nach bekannter Dauer</p>${[['Unter 30 min',1],['30–60 min',1],['Über 60 min',2]].map(([label,n])=>`<div class="mf-simplebar"><span>${label}</span><strong>${n}</strong><div class="mf-track"><span style="width:${n/4*100}%"></span></div></div>`).join('')}<p class="mf-muted mf-section-gap">2 weitere Flüge: Dauer unbekannt</p>${button('metric','Dauer im Detail →','mf-text-action mf-section-gap','data-metric="duration"')}</div>`;
    return `${body}<div class="mf-chart-tabs" aria-label="Flugübersicht wählen">${[['year','Jahr'],['aircraft','Flugzeuge'],['duration','Flugdauer']].map(([key,label])=>`<button type="button" data-action="chart" data-chart="${key}" aria-pressed="${state.chart===key}">${label}</button>`).join('')}</div>`;

  function updateSyncHeader(){

  function go(page){if(page!==state.page)state.history.push(state.page);state.page=page;closeFilter(false);render();remember();}
  function closeFilter(focus=true){if(overlay.hidden)return;overlay.hidden=true;content.inert=false;nav.inert=false;root.querySelector('.mf-header').inert=false;if(focus&&filterReturn)filterReturn.focus();}
  function openFilter(){filterReturn=root.querySelector('[data-action="filter"]');for(const [key,value]of Object.entries(state.filters))form.elements.namedItem(key).value=value;overlay.hidden=false;content.inert=true;nav.inert=true;root.querySelector('.mf-header').inert=true;form.elements.namedItem('year').focus();}
  function applyFilter(){state.filters=Object.fromEntries(['year','aircraft','person','role'].map(key=>[key,form.elements.namedItem(key).value]));closeFilter(false);render();root.querySelector('[data-action="filter"]')?.focus();remember();}
  function showToast(text){clearTimeout(toastTimer);toast.textContent=text;toast.hidden=false;toastTimer=setTimeout(()=>toast.hidden=true,6500);}
  root.addEventListener('click',event=>{

    const target=event.target.closest('[data-action]');if(!target)return;
    const action=target.dataset.action;
    if(action==='back'){state.page=state.history.pop()||({detail:'flights',analytics:'start',anchor:'books',profile:'start'}[state.page]||'start');render();remember();}

    if(action==='refresh-error'){state.sync='error';updateSyncHeader();remember();showToast('Beispielzustand: Abruf fehlgeschlagen. Letzter erfolgreicher Stand und gespeicherte Flüge bleiben erhalten.');}

    if(action==='apply-filter')applyFilter();
    if(action==='reset-filter'){for(const[key,value]of Object.entries(defaultFilters()))form.elements.namedItem(key).value=value;}
    if(action==='clear-issues'){state.issues=false;render();remember();}
    if(action==='clear-query'){state.issues=false;state.filters=defaultFilters();state.search='';render();remember();}
    if(action==='anchor')go('anchor');
    if(action==='anchor-confirm'||action==='anchor-photo')showToast('Hier endet diese Vorschau. Der Buchstand wurde nicht geändert.');
    if(action==='club-item'){state.clubSection=target.dataset.section;go('club');}
  });
  root.addEventListener('input',event=>{
    if(event.target.id!=='mf-search')return;state.search=event.target.value;root.querySelector('#mf-list-summary').innerHTML=listSummary(filtered());root.querySelector('#mf-flight-rows').innerHTML=flightRows(filtered());syncIcons();remember();
  });
  root.addEventListener('change',event=>{
    if(event.target.id==='mf-book-select'&&books[event.target.value]){state.book=event.target.value;render();remember();}
    if(event.target.id==='mf-analytics-year'){state.filters.year=event.target.value;render();remember();}
  });
  form.addEventListener('submit',event=>{event.preventDefault();applyFilter();});
  overlay.addEventListener('click',event=>{if(event.target===overlay)closeFilter();});
  root.addEventListener('keydown',event=>{
    if(overlay.hidden)return;
    if(event.key==='Escape'){event.preventDefault();closeFilter();}
    if(event.key==='Tab'){const targets=[...overlay.querySelectorAll('button,select')],first=targets[0],last=targets[targets.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
  });
  restore(window.openai?.widgetState);render();
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){const before=JSON.stringify(state);restore(event.detail.globals.widgetState);if(JSON.stringify(state)!==before)render();}});
  if(globalThis.Tweak){const appearance={radius:18};const tweak=new Tweak({container:phone,onChange:()=>phone.style.setProperty('--mf-radius',`${appearance.radius}px`)});tweak.addSlider(appearance,'radius',{label:'Kartenrundung',min:12,max:24,unit:'px'});}
})();
</script>
