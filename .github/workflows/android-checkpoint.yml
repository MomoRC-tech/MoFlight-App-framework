name: Android checkpoint
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'apps/platform-lab/app.json'
      - 'apps/platform-lab/app.config.*'
      - 'apps/platform-lab/plugins/**'
      - 'apps/platform-lab/android/**'
      - 'scripts/*android*.py'
      - 'scripts/*android*.ps1'
      - 'scripts/configure-windows-native-build.ps1'
      - 'tests/test_android*.py'
      - '.github/workflows/android-checkpoint.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source commit or ref (blank uses selected workflow ref)'
        type: string
        default: ''
      force_fresh:
        description: 'Compile a fresh APK even when matching artifacts exist'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  android-plan:
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.plan.outputs.run_id }}
      source-commit: ${{ steps.plan.outputs.source_commit }}
      checkout-commit: ${{ steps.plan.outputs.checkout_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: ci-tooling
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}
          path: source
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: plan
        run: python ../ci-tooling/scripts/android_build_plan.py
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FRESH: ${{ inputs.force_fresh }}
  android-offline:
    needs: android-plan
    if: needs.android-plan.outputs.run-id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.android-plan.outputs.checkout-commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @moflight/platform-lab exec expo prebuild --no-install --platform android
        env:
          EXPO_OFFLINE: '1'
      - run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --max-workers=2
        working-directory: apps/platform-lab/android
      - name: Check embedded JavaScript and device architectures
        run: python scripts/android_smoke.py --check-apk apps/platform-lab/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: moflight-synthetic-android-offline
          path: apps/platform-lab/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
  android-smoke:
    needs: [android-plan, android-offline]
    if: ${{ !cancelled() && needs.android-plan.result == 'success' && (needs.android-offline.result == 'success' || needs.android-offline.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.android-plan.outputs.checkout-commit }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download matching compiled APK on a clean runner
        uses: actions/download-artifact@v8
        with:
          name: moflight-synthetic-android-offline
          path: local-data/android-apk
          run-id: ${{ needs.android-plan.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Check downloaded APK bundle and architectures
        run: python scripts/android_smoke.py --check-apk local-data/android-apk/app-release.apk
      - name: Enable emulator KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run native offline persistence smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VALIDATED_SOURCE_COMMIT: ${{ needs.android-plan.outputs.checkout-commit }}
          APK_SOURCE_COMMIT: ${{ needs.android-plan.outputs.source-commit || needs.android-plan.outputs.checkout-commit }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          avd-name: MoFlight_Synthetic_API37
          disable-animations: true
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none -skin 480x800
          script: |
            python scripts/android_smoke.py --apk local-data/android-apk/app-release.apk --serial emulator-${EMULATOR_PORT} --expected-avd MoFlight_Synthetic_API37 --output local-data/android-smoke
            if [ -f scripts/android_book_smoke.py ]; then
              python scripts/android_book_smoke.py --serial emulator-${EMULATOR_PORT} --expected-avd MoFlight_Synthetic_API37 --output local-data/android-books
            fi
      - name: Upload actual emulator evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moflight-android-emulator-evidence
          path: |
            local-data/android-smoke/
            local-data/android-books/
          if-no-files-found: warn
          retention-days: 7
