name: Android UI smoke
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-ui-${{ github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      # Reuse a successful APK workflow for this exact commit. Fail if missing;
      # never silently choose an older main binary or compile a duplicate APK.
      - name: Find matching successful APK run
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/find_android_artifact.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: moflight-apk-${{ github.sha }}
          path: build/android
          run-id: ${{ steps.apk.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: npm run maestro:install
      - name: Enable emulator KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run guarded offline smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          avd-name: MoFlight_Synthetic_API37
          disable-animations: true
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: npm run test:e2e -- --serial emulator-${EMULATOR_PORT}
      - name: Upload test report and bounded diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maestro-evidence-${{ github.sha }}
          path: build/e2e/
          if-no-files-found: warn
          retention-days: 3
