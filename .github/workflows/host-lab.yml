name: Synthetic platform lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q pocs tests
      - run: git diff --check
  mobile-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm fixtures:check
      - run: pnpm bundle
        env:
          EXPO_OFFLINE: '1'
      - run: pnpm --filter @moflight/platform-lab prebuild:check
        env:
          EXPO_OFFLINE: '1'
      - run: git diff --check
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @moflight/platform-lab exec expo prebuild --no-install --platform android
        env:
          EXPO_OFFLINE: '1'
      - run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2
        working-directory: apps/platform-lab/android
      - uses: actions/upload-artifact@v4
        with:
          name: moflight-synthetic-android-debug
          path: apps/platform-lab/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
