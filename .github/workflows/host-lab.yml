name: Synthetic platform lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q pocs tests
      - run: git diff --check
  mobile-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm fixtures:check
      - run: pnpm bundle
        env:
          EXPO_OFFLINE: '1'
      - run: pnpm --filter @moflight/platform-lab prebuild:check
        env:
          EXPO_OFFLINE: '1'
      - run: git diff --check
  android-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @moflight/platform-lab exec expo prebuild --no-install --platform android
        env:
          EXPO_OFFLINE: '1'
      - run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --max-workers=2
        working-directory: apps/platform-lab/android
      - name: Check embedded JavaScript and device architectures
        run: python scripts/android_smoke.py --check-apk apps/platform-lab/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: moflight-synthetic-android-offline
          path: apps/platform-lab/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
      - name: Enable emulator KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run native offline persistence smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: python scripts/android_smoke.py --apk apps/platform-lab/android/app/build/outputs/apk/release/app-release.apk --output local-data/android-smoke
      - name: Upload actual emulator evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moflight-android-emulator-evidence
          path: local-data/android-smoke/
          if-no-files-found: warn
          retention-days: 7
