name: Fast platform checks
# Optional hosted checks: manual only. Local verification remains required.
# Dispatch only within free quota; this workflow does not authorize paid CI.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: python scripts/mobile_fixtures.py --check
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
      - name: Android validation scope
        shell: bash
        run: echo 'Fast checks only. Android APK compilation/runtime acceptance is not run here; see the separate Android checkpoint workflow.' >> "$GITHUB_STEP_SUMMARY"
  host-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q pocs tests
      - run: git diff --check
  mobile-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm fixtures:check
      - run: pnpm bundle
        env:
          EXPO_OFFLINE: '1'
      - run: pnpm --filter @moflight/platform-lab prebuild:check
        env:
          EXPO_OFFLINE: '1'
      - run: git diff --check
